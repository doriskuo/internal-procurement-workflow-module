version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: procurement_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: procurement
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: procurement_api
    environment:
      PORT: 3000
      DATABASE_URL: "mysql://root:root@mysql:3306/procurement"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: procurement_web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
